services:
  mysql:
    image: mysql:8.0
    container_name: myshop_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${DB_NAME:-myshop_db}
      MYSQL_USER: ${DB_USER:-myshop_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-myshop_password_change_me}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myshop_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-myshop_user}
      DB_PASSWORD: ${DB_PASSWORD:-myshop_password_change_me}
      DB_NAME: ${DB_NAME:-myshop_db}
      JWT_SECRET: ${JWT_SECRET:-generate_a_secure_jwt_secret_min_32_chars}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThisAdminPasswordImmediately123!}
      CHARGILY_PUBLIC_KEY: ${CHARGILY_PUBLIC_KEY:-}
      CHARGILY_SECRET_KEY: ${CHARGILY_SECRET_KEY:-}
      CHARGILY_MODE: ${CHARGILY_MODE:-test}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  mysql_data:
    driver: local
