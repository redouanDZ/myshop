<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التسوق - متجر الإلكتروني</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet"> <!-- خط عربي -->
  <style>
    .shop-section { padding: 40px 0; }
    .shop-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 30px;
      align-items: start;
    }
    .shop-sidebar {
      background: var(--card-bg, white);
      border: 1px solid var(--border-color, #edf2f7);
      border-radius: var(--border-radius, 12px);
      padding: 24px;
      box-shadow: var(--box-shadow);
      position: sticky;
      top: 20px;
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color, #f1f5f9);
    }
    .sidebar-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--dark-color, #1e293b);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .reset-filters-btn {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .reset-filters-btn:hover { opacity: 0.8; text-decoration: underline; }
    .filter-group {
      margin-bottom: 24px;
    }
    .filter-group:last-child { margin-bottom: 0; }
    .filter-group h4 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--dark-color, #334155);
      margin-bottom: 12px;
    }
    .filter-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-option-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--light-text, #475569);
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .filter-option-label:hover { color: var(--primary-color); }
    .filter-option-label input[type="radio"],
    .filter-option-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
      cursor: pointer;
    }
    .price-range-box {
      background: var(--light-color, #f8fafc);
      padding: 15px;
      border-radius: var(--border-radius-sm, 8px);
      border: 1px solid var(--border-color, #e2e8f0);
    }
    .price-slider-container input[type="range"] {
      width: 100%;
      accent-color: var(--primary-color);
      cursor: pointer;
    }
    .price-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--light-text, #64748b);
      margin-top: 8px;
      font-weight: 600;
    }
    .products-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; background: var(--card-bg, white); padding: 16px; border-radius: var(--border-radius, 12px); border: 1px solid var(--border-color, #edf2f7); }
    .search-box { position: relative; flex: 1; min-width: 260px; }
    .search-box input { width: 100%; padding: 10px 15px 10px 40px; border: 1px solid var(--border-color, #cbd5e1); border-radius: var(--border-radius-sm, 8px); font-family: inherit; font-size: 0.95rem; }
    .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--light-text, #94a3b8); }
    .filter-box { display: flex; gap: 10px; align-items: center; }
    .filter-box select { padding: 9px 14px; border: 1px solid var(--border-color, #cbd5e1); border-radius: var(--border-radius-sm, 8px); background: var(--card-bg, white); cursor: pointer; font-family: inherit; font-size: 0.9rem; color: var(--text-color, #334155); }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
    .product-card { border: 1px solid var(--border-color, #edf2f7); border-radius: var(--border-radius, 12px); padding: 18px; text-align: right; background: var(--card-bg, white); transition: var(--transition); position: relative; box-shadow: var(--box-shadow); display: flex; flex-direction: column; justify-content: space-between; }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--box-shadow-hover); }
    .product-image { width: 100%; height: 180px; object-fit: cover; border-radius: var(--border-radius-sm, 8px); margin-bottom: 12px; }
    .product-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; color: var(--dark-color, #1e293b); height: 48px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .product-category { color: var(--light-text, #64748b); font-size: 0.85rem; margin-bottom: 8px; }
    .product-price { font-size: 1.25rem; color: var(--primary-color); font-weight: 800; margin-bottom: 8px; }
    .product-stock { font-size: 0.85rem; margin-bottom: 12px; font-weight: 600; }
    .product-stock.in-stock { color: var(--success-color); }
    .product-stock.low-stock { color: var(--warning-color); }
    .product-stock.out-of-stock { color: var(--danger-color); }
    .add-to-cart { background: var(--primary-gradient); color: white; padding: 10px 15px; border: none; border-radius: var(--border-radius-sm, 8px); cursor: pointer; font-weight: 700; font-family: inherit; transition: var(--transition); width: 100%; margin-bottom: 8px; }
    .add-to-cart:hover { background: var(--primary-hover-gradient); }
    .view-details { display: block; text-align: center; color: var(--primary-color); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .view-details:hover { text-decoration: underline; color: var(--primary-hover); }
    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 30px; }
    .page-btn { padding: 8px 14px; border: 1px solid var(--border-color, #cbd5e1); background: var(--card-bg, white); cursor: pointer; border-radius: var(--border-radius-sm, 8px); font-family: inherit; font-weight: 600; transition: var(--transition); }
    .page-btn.active { background: var(--primary-gradient); color: white; border-color: var(--primary-color); }
    .page-btn.disabled { opacity: 0.5; cursor: not-allowed; }
    @media (max-width: 992px) {
      .shop-layout { grid-template-columns: 1fr; }
      .shop-sidebar { position: static; }
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: var(--success-color);
      color: white;
      padding: 15px 25px;
      border-radius: var(--border-radius);
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 300px;
      transform: translateX(150%);
      transition: transform 0.3s ease;
    }
    .notification.error { background-color: var(--danger-color); }
    .close-notification { margin-left: 15px; cursor: pointer; font-size: 20px; font-weight: bold; }
    .notification.show { transform: translateX(0); }
  </style>
</head>
<body>
  <!-- رأس الموقع -->
  <header>
    <div class="container">
      <div class="logo">
        <a href="index.html" data-i18n="common.store_name">المتجر الإلكتروني</a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html" data-i18n="nav.home">الرئيسية</a></li>
          <li><a href="shop.html" class="active" data-i18n="nav.shop">التسوق</a></li>
          <li><a href="cart.html" data-i18n="nav.cart">عربة التسوق</a></li>
          <li><a href="track-order.html" data-i18n="nav.track_order">تتبع طلبي</a></li>
        </ul>
      </nav>
      <div class="user-actions">
        <a href="wishlist.html" class="wishlist-icon" title="المفضلة" style="position: relative; margin-left: 12px; color: #ef4444; font-size: 1.15rem;">
          <i class="fas fa-heart"></i>
          <span class="wishlist-count" id="wishlist-count" style="position: absolute; top: -8px; right: -10px; background: #ef4444; color: #fff; border-radius: 50%; padding: 2px 6px; font-size: 0.75rem; font-weight: bold;">0</span>
        </a>
        <a href="cart.html" class="cart-icon">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-count" id="cart-count">0</span>
        </a>
        <a href="account.html" class="user-icon" title="حسابي">
          <i class="fas fa-user"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- عنوان الصفحة -->
  <div class="page-title">
    <div class="container">
      <h1>التسوق</h1>
      <div class="breadcrumb">
        <a href="index.html">الرئيسية</a> <i class="fas fa-chevron-left"></i> التسوق
      </div>
    </div>
  </div>

  <!-- قسم المنتجات -->
  <section class="shop-section">
    <div class="container">
      <div class="shop-layout">
        
        <!-- الشريط الجانبي (Sidebar) للفلاتر -->
        <aside class="shop-sidebar">
          <div class="sidebar-header">
            <h3><i class="fas fa-sliders-h"></i> فلاتر المنتجات</h3>
            <button type="button" class="reset-filters-btn" onclick="resetFilters()"><i class="fas fa-redo-alt"></i> إعادة ضبط</button>
          </div>

          <!-- تصنيفات المنتجات -->
          <div class="filter-group">
            <h4><i class="fas fa-tags" style="color:#0284c7;"></i> التصنيفات</h4>
            <div class="filter-options">
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="" checked onchange="applyFilters()">
                <span>الكل</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="إلكترونيات" onchange="applyFilters()">
                <span>إلكترونيات</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="ملابس" onchange="applyFilters()">
                <span>ملابس</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="كتب" onchange="applyFilters()">
                <span>كتب</span>
              </label>
            </div>
          </div>

          <!-- فلتر نطاق السعر -->
          <div class="filter-group">
            <h4><i class="fas fa-coins" style="color:var(--primary-color);"></i> أقصى سعر (دج)</h4>
            <div class="price-range-box">
              <div class="price-slider-container">
                <input type="range" id="priceRange" min="0" max="200000" step="5000" value="200000" oninput="updatePriceLabel(); applyFilters();">
              </div>
              <div class="price-labels">
                <span>0 دج</span>
                <span>حتى: <strong id="priceRangeValue" style="color:var(--primary-color);">200,000 دج</strong></span>
              </div>
            </div>
          </div>

          <!-- فلتر تقييم النجوم -->
          <div class="filter-group">
            <h4><i class="fas fa-star" style="color:var(--warning-color);"></i> التقييم</h4>
            <div class="filter-options">
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="0" checked onchange="applyFilters()">
                <span>جميع التقييمات</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="4.5" onchange="applyFilters()">
                <span>⭐ 4.5 فما فوق (ممتاز)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="4.0" onchange="applyFilters()">
                <span>⭐ 4.0 فما فوق (جيد جداً)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="3.0" onchange="applyFilters()">
                <span>⭐ 3.0 فما فوق</span>
              </label>
            </div>
          </div>

          <!-- فلتر حالة المخزون -->
          <div class="filter-group">
            <h4><i class="fas fa-boxes" style="color:var(--success-color);"></i> التوفر في المتجر</h4>
            <div class="filter-options">
              <label class="filter-option-label">
                <input type="checkbox" id="inStockOnly" onchange="applyFilters()">
                <span>المتوفر في المخزون فقط</span>
              </label>
            </div>
          </div>
        </aside>

        <!-- المحتوى الرئيسي للمنتجات -->
        <main class="shop-main">
          <div class="products-header">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" id="searchInput" placeholder="ابحث عن منتج بالاسم...">
            </div>
            <div class="filter-box">
              <span id="resultsCount" style="font-weight: 600; color: var(--light-text, #64748b); font-size: 0.9rem;"></span>
              <select id="sortFilter" onchange="applyFilters()">
                <option value="newest">الأحدث أولاً</option>
                <option value="rating-desc">التقييم: الأعلى تقييماً ⭐</option>
                <option value="price-asc">السعر: الأقل إلى الأعلى</option>
                <option value="price-desc">السعر: الأعلى إلى الأقل</option>
                <option value="name-asc">الاسم: أ-ي</option>
                <option value="name-desc">الاسم: ي-أ</option>
              </select>
            </div>
          </div>

          <div id="products-container" class="products-grid">
            <!-- Animated Skeleton Loading Placeholders -->
            <div class="product-skeleton-card">
              <div class="skeleton skeleton-image"></div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-price"></div>
              <div class="skeleton-actions">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
              </div>
            </div>
            <div class="product-skeleton-card">
              <div class="skeleton skeleton-image"></div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-price"></div>
              <div class="skeleton-actions">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
              </div>
            </div>
            <div class="product-skeleton-card">
              <div class="skeleton skeleton-image"></div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-price"></div>
              <div class="skeleton-actions">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
              </div>
            </div>
            <div class="product-skeleton-card">
              <div class="skeleton skeleton-image"></div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-price"></div>
              <div class="skeleton-actions">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
              </div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </main>

      </div>
    </div>
  </section>

  <!-- التذييل -->
  <footer>
    <div class="container">
      <p>&copy; 2025 متجر الإلكتروني. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <script>
    let products = [];
    let filteredProducts = [];
    let currentPage = 1;
    const itemsPerPage = 8;

    async function loadProducts() {
      try {
        const response = await fetch('/api/products');
        if (!response.ok) throw new Error('خطأ في جلب المنتجات');
        const data = await response.json();
        products = Array.isArray(data) ? data : (Array.isArray(data && data.products) ? data.products : []);
        
        // إيجاد أعلى سعر ديناميكياً
        if (products.length > 0) {
          const maxProductPrice = Math.max(...products.map(p => Number(p.price) || 0));
          const priceSlider = document.getElementById('priceRange');
          if (priceSlider && maxProductPrice > 0) {
            priceSlider.max = Math.ceil(maxProductPrice / 10000) * 10000;
            priceSlider.value = priceSlider.max;
            updatePriceLabel();
          }
        }

        applyFilters();
      } catch (error) {

        document.getElementById('products-container').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--danger-color); padding: 30px;">حدث خطأ في تحميل المنتجات. يرجى المحاولة لاحقاً.</p>';
      }
    }

    function updatePriceLabel() {
      const priceSlider = document.getElementById('priceRange');
      const priceLabel = document.getElementById('priceRangeValue');
      if (priceSlider && priceLabel) {
        priceLabel.textContent = Number(priceSlider.value).toLocaleString() + ' دج';
      }
    }

    function applyFilters() {
      const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase();
      
      const selectedCategoryRadio = document.querySelector('input[name="categoryFilter"]:checked');
      const categoryValue = selectedCategoryRadio ? selectedCategoryRadio.value : '';

      const selectedRatingRadio = document.querySelector('input[name="ratingFilter"]:checked');
      const minRating = Number(selectedRatingRadio ? selectedRatingRadio.value : 0);

      const maxPrice = Number(document.getElementById('priceRange')?.value || 200000);
      const inStockOnly = document.getElementById('inStockOnly')?.checked || false;
      const sortFilter = document.getElementById('sortFilter')?.value || 'newest';

      filteredProducts = products.filter(product => {
        const price = Number(product.price);
        const stock = Number(product.stock);
        const rating = Number(product.rating || 5);

        const matchesSearch = product.name.toLowerCase().includes(searchQuery);
        const matchesCategory = !categoryValue || product.category === categoryValue;
        const matchesPrice = price <= maxPrice;
        const matchesRating = rating >= minRating;
        const matchesStock = !inStockOnly || stock > 0;

        return matchesSearch && matchesCategory && matchesPrice && matchesRating && matchesStock;
      });

      filteredProducts.sort((a, b) => {
        switch (sortFilter) {
          case 'newest': return new Date(b.created_at) - new Date(a.created_at);
          case 'rating-desc': return (Number(b.rating) || 0) - (Number(a.rating) || 0);
          case 'price-asc': return Number(a.price) - Number(b.price);
          case 'price-desc': return Number(b.price) - Number(a.price);
          case 'name-asc': return a.name.localeCompare(b.name, 'ar');
          case 'name-desc': return b.name.localeCompare(a.name, 'ar');
          default: return 0;
        }
      });

      // تحديث عداد النتائج
      const countEl = document.getElementById('resultsCount');
      if (countEl) {
        countEl.textContent = `عُثر على (${filteredProducts.length}) منتج`;
      }

      currentPage = 1;
      renderProducts();
      renderPagination();
    }

    function resetFilters() {
      if (document.getElementById('searchInput')) document.getElementById('searchInput').value = '';
      
      const defaultCategoryRadio = document.querySelector('input[name="categoryFilter"][value=""]');
      if (defaultCategoryRadio) defaultCategoryRadio.checked = true;

      const defaultRatingRadio = document.querySelector('input[name="ratingFilter"][value="0"]');
      if (defaultRatingRadio) defaultRatingRadio.checked = true;

      const priceSlider = document.getElementById('priceRange');
      if (priceSlider) {
        priceSlider.value = priceSlider.max;
        updatePriceLabel();
      }

      if (document.getElementById('inStockOnly')) document.getElementById('inStockOnly').checked = false;
      if (document.getElementById('sortFilter')) document.getElementById('sortFilter').value = 'newest';

      applyFilters();
    }

    function renderProducts() {
      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const pageProducts = filteredProducts.slice(start, end);

      const container = document.getElementById('products-container');
      if (pageProducts.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">
              <i class="fas fa-search"></i>
            </div>
            <h3 class="empty-state-title">لم نجد منتجات مطابقة لخيارات البحث</h3>
            <p class="empty-state-desc">جرب استخدام كلمات بحث مختلفة أو قم بتوسيع نطاق السعر والتصنيفات المختارة.</p>
            <button type="button" class="btn btn-primary" onclick="resetFilters()">
              <i class="fas fa-redo-alt"></i> إعادة تعيين الفلاتر
            </button>
          </div>
        `;
        return;
      }

      const wishlistIds = window.getWishlist ? window.getWishlist() : [];

      container.innerHTML = pageProducts.map(product => {
        const isFav = wishlistIds.includes(product.id);
        const stockNum = Number(product.stock) || 0;
        const safeName = window.escapeHtml ? window.escapeHtml(product.name) : product.name;
        const safeCat = window.escapeHtml ? window.escapeHtml(product.category || 'عام') : (product.category || 'عام');
        return `
        <div class="product-card" id="shop-product-${product.id}">
          <span class="product-badge">${safeCat}</span>
          <button type="button" class="product-wishlist ${isFav ? 'active' : ''}" data-wishlist-id="${product.id}" onclick="handleToggleWishlist(${product.id})" aria-label="المفضلة">
            <i class="${isFav ? 'fas fa-heart' : 'far fa-heart'}"></i>
          </button>
          <a href="product.html?id=${product.id}" class="product-image">
            <img src="${product.image_url || '/images/product-placeholder.jpg'}" alt="${safeName}" loading="lazy" onerror="this.src='/images/product-placeholder.jpg'">
          </a>
          <div class="product-info">
            <span class="product-category">${safeCat}</span>
            <h3 class="product-name">
              <a href="product.html?id=${product.id}">${safeName}</a>
            </h3>
            <div class="product-rating">
              <div class="rating-stars" style="color: #f59e0b; font-size: 0.85rem;">
                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
              </div>
              <span class="rating-count" style="font-size: 0.8rem; color: var(--light-text); margin-inline-start: 6px;">(${product.rating || '4.5'})</span>
            </div>
            <div class="product-price-row" style="display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 14px;">
              <span class="product-price">${Number(product.price).toLocaleString()} <small style="font-size: 0.85rem; font-weight: 600;">دج</small></span>
              <span style="font-size: 0.8rem; color: ${stockNum > 3 ? 'var(--success-color)' : stockNum > 0 ? 'var(--warning-color)' : 'var(--danger-color)'}; font-weight: 600;">
                <i class="fas fa-box"></i> ${stockNum > 0 ? `متوفر (${stockNum})` : 'نفد المخزون'}
              </span>
            </div>
            <div style="display: flex; gap: 8px; margin-top: auto;">
              <a href="product.html?id=${product.id}" class="btn btn-secondary" style="flex: 1; padding: 9px; font-size: 0.88rem; text-align: center; justify-content: center;">التفاصيل</a>
              <button type="button" onclick="handleAddToCart(${product.id})" class="btn" style="flex: 1.3; padding: 9px; font-size: 0.88rem; justify-content: center;" ${stockNum <= 0 ? 'disabled' : ''}>
                <i class="fas fa-cart-plus"></i> أضف للسلة
              </button>
            </div>
          </div>
        </div>
      `}).join('');
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
      const pagination = document.getElementById('pagination');
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      let paginationHTML = `
        <button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="changePage(${currentPage - 1})">
          <i class="fas fa-chevron-right"></i> السابق
        </button>
      `;

      for (let i = 1; i <= totalPages; i++) {
        paginationHTML += `
          <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>
        `;
      }

      paginationHTML += `
        <button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="changePage(${currentPage + 1})">
          التالي <i class="fas fa-chevron-left"></i>
        </button>
      `;

      pagination.innerHTML = paginationHTML;
    }

    function changePage(page) {
      const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderProducts();
      renderPagination();
    }

    async function handleAddToCart(productId) {
      try {
        let product = products.find(p => p.id === productId);
        if (!product) {
          const response = await fetch(`/api/products/${productId}`);
          if (response.ok) {
            product = await response.json();
          }
        }
        if (!product) {
          showNotification('تعذر العثور على بيانات المنتج', 'error');
          return;
        }

        if (typeof window.addToCart === 'function') {
          await window.addToCart(product, 1);
        } else {
          let cart = [];
          try { cart = JSON.parse(localStorage.getItem('cart') || '[]'); } catch (e) {}
          const existing = cart.find(item => item.id === product.id);
          if (existing) {
            existing.quantity = Math.min(20, existing.quantity + 1);
          } else {
            cart.push({
              id: product.id,
              name: product.name,
              price: Number(product.price) || 0,
              image: product.image || product.image_url || '/images/product-placeholder.jpg',
              quantity: 1
            });
          }
          localStorage.setItem('cart', JSON.stringify(cart));
          window.cart = cart;
          const cartCount = document.getElementById('cart-count') || document.querySelector('.cart-count');
          if (cartCount) {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalCount;
          }
          showNotification(`تمت إضافة "${product.name}" إلى سلة التسوق 🛒`, 'success');
        }
      } catch (error) {
        showNotification('حدث خطأ أثناء إضافة المنتج إلى السلة', 'error');
      }
    }

    function showNotification(message, type = 'success') {
      if (window.showToast) {
        window.showToast(message, type);
        return;
      }
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.textContent = message;
      const closeBtn = document.createElement('span');
      closeBtn.className = 'close-notification';
      closeBtn.innerHTML = '&times;';
      closeBtn.addEventListener('click', () => notification.remove());
      notification.appendChild(closeBtn);
      document.body.appendChild(notification);
      setTimeout(() => notification.classList.add('show'), 10);
      setTimeout(() => {
        notification.classList.remove('show');
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    }

    async function handleToggleWishlist(productId) {
      const prod = products.find(p => p.id === productId);
      if (prod) {
        if (window.toggleWishlist) {
          await window.toggleWishlist(prod.id, prod.name);
        } else if (window.WishlistManager) {
          await window.WishlistManager.toggleItem(prod);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.addEventListener('input', applyFilters);
      
      const sortFilter = document.getElementById('sortFilter');
      if (sortFilter) sortFilter.addEventListener('change', applyFilters);
    });
  </script>

  <script src="js/user-system.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>

</body>
